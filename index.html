  .chip { flex:0 0 auto; padding:6px 14px; border-radius:999px; background:#fff; border:1px solid #ffd0d0;
          color:#c0392b; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .1s; }
  .chip.active { background:#c41e3a; color:#fff; border-color:#c41e3a; }

  .chip.type { background:#eafaf1; border-color:#a8e6c1; color:#1a7a45; }

  .count { padding:6px 16px 8px; font-size:12px; color:#999; }
  .count b { color:#8b0000; }
  .card { position:relative; display:flex; align-items:center; gap:14px; background:#fff; border-radius:14px;
          padding:14px 16px; margin-bottom:12px; text-decoration:none; color:inherit;
          box-shadow:0 1px 6px rgba(0,0,0,.06); transition:transform .08s; }
  .card:active { transform:scale(.98); }
  .date { flex:0 0 56px; text-align:center; background:#fff5f5; border:1px solid #ffcdd2;
          border-radius:10px; padding:8px 4px; }
  .date .d { display:block; font-size:22px; font-weight:800; color:#8b0000; line-height:1; }
  .date .md { display:block; font-size:11px; color:#c0392b; margin-top:3px; }
  .body { flex:1; min-width:0; padding-right:6px; }
  .title { font-size:15.5px; font-weight:600; color:#1a1a1a; line-height:1.4;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sub { font-size:12px; color:#888; margin-top:5px; }
  .tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; }
  .ct { font-size:11px; color:#c0392b; background:#fff0f0; border:1px solid #ffd9d9;
        border-radius:6px; padding:1px 7px; }
  .arrow { flex:0 0 auto; font-size:24px; color:#ccc; }
  .mark { position:absolute; top:7px; right:12px; display:flex; gap:7px; z-index:6; }
  .mark span { font-size:15px; cursor:pointer; user-select:none; line-height:1; }
  .mark .star.on { color:#f5a623; }
  .mark .st.todo { color:#c0392b; }
  .mark .st.done { color:#1a9e4f; }
  .footer { text-align:center; font-size:12px; color:#aaa; padding:10px 0 4px; }
  /* 月份卡片 */
  .month-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding:4px 2px 12px; }
  .month-card { display:flex; flex-direction:column; justify-content:center; align-items:center;
                gap:6px; background:#fff; border-radius:16px; padding:22px 10px; text-decoration:none;
                color:inherit; box-shadow:0 1px 6px rgba(0,0,0,.06); border:1px solid #e5e7eb;
                transition:transform .08s, border-color .1s; }
  .month-card:active { transform:scale(.96); }
  .month-card .month-title { font-size:17px; font-weight:700; color:#1a1a1a; }
  .month-card .month-count { font-size:13px; color:#666; background:#f3f4f6; border-radius:999px;
                              padding:3px 12px; }
  .total-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 16px 14px;
               font-size:13px; color:#666; }
